name: SDK Compatibility Gate

on:
  pull_request:
    branches: [ main, convergence/ghostcode-2.0 ]
  repository_dispatch:
    types: [ nativeshellkit-released ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  compatibility-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Authenticate GitHub Packages NuGet source
        shell: pwsh
        run: |
          dotnet nuget update source github-nativeshellkit `
            --username x-access-token `
            --password "${{ secrets.GITHUB_TOKEN }}" `
            --store-password-in-clear-text `
            --configfile NuGet.Config
      - name: Restore and Build GhostCode (Release|x64)
        run: dotnet build GhostCode.sln -c Release -p:Platform=x64
      - name: Archive and Diff Regression Tests
        run: dotnet test tests/GhostCode.Tests -c Release --no-build --filter "FullyQualifiedName~PhaseBArchiverTests|FullyQualifiedName~ArchiveDiffEngineTests"
      - name: WinUI Isolated Self-Test
        shell: pwsh
        run: |
          $exe = 'src/GhostCode.App/bin/x64/Release/net10.0-windows10.0.19041.0/win-x64/GhostCode.App.exe'
          ./packaging/Test-M12Gui.ps1 -Application $exe -ReportDirectory (Join-Path $env:RUNNER_TEMP 'm12-gui')

  dependabot-patch-automerge:
    needs: compatibility-gate
    if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Auto-merge PATCH updates only; hold MINOR/MAJOR (and 0.x minor) for human review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Dependabot update-type=$UPDATE_TYPE group=$DEPENDENCY_GROUP"
          if [ "$UPDATE_TYPE" = "version-update:semver-patch" ]; then
            gh pr merge --auto --squash "$PR_URL"
          else
            echo "Holding $UPDATE_TYPE update for explicit human review (no silent breaking or 0.x minor updates)."
          fi
