name: GhostCode CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore GhostCode.sln -r win-x64

      - name: Build Release (x64)
        run: dotnet build GhostCode.sln -c Release -p:Platform=x64 --no-restore

      - name: Run full test suite
        run: dotnet test GhostCode.sln -c Release -p:Platform=x64 --no-build --verbosity normal

      - name: Upload portable WinUI 3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostCode-WinUI3-win-x64
          path: src/GhostCode.App/bin/x64/Release/net10.0-windows10.0.19041.0/win-x64/
          retention-days: 14
